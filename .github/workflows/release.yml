name: release
on:
  workflow_dispatch: {}
  push:
    tags: ["testless-v*"]
permissions:
  contents: write
jobs:
  build:
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-gnu, cross: true }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: macos-latest, target: aarch64-apple-darwin }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.target }}" }
      - if: matrix.cross
        run: cargo install cross --locked
      - name: Build
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then cross build --release --locked -p testless --target ${{ matrix.target }}
          else cargo build --release --locked -p testless --target ${{ matrix.target }}; fi
      - name: Package
        run: tar czf testless-${{ matrix.target }}.tar.gz -C target/${{ matrix.target }}/release testless
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with: { files: "testless-*.tar.gz" }

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then echo "no token; skipping crates.io publish"; exit 0; fi
          for c in testless-core testless-lang-ts testless-lang-go testless-lang-rust testless; do
            set +e
            out=$(cargo publish -p "$c" --no-verify 2>&1)
            status=$?
            set -e
            echo "$out"
            if [ $status -ne 0 ]; then
              if echo "$out" | grep -qi "already uploaded\|already exists"; then
                echo "$c already published; continuing"
              else
                echo "publish failed for $c" >&2
                exit 1
              fi
            fi
            sleep 30
          done

  npm-publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "24", registry-url: "https://registry.npmjs.org" }
      - name: Publish npm packages
        env:
          GH_TOKEN: ${{ github.token }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [[ "${GITHUB_REF_NAME}" == testless-v* ]]; then
            version="${GITHUB_REF_NAME#testless-v}"
          else
            # workflow_dispatch from a branch: publish the version already
            # released on crates.io, using that release's binary assets
            version=$(grep -m1 '^version = ' crates/cli/Cargo.toml | cut -d'"' -f2)
          fi
          tag="testless-v${version}"

          workdir=$(mktemp -d)
          gh release download "$tag" --dir "$workdir" --pattern 'testless-*.tar.gz'

          declare -A targets=(
            [x86_64-unknown-linux-gnu]=testless-linux-x64
            [aarch64-unknown-linux-gnu]=testless-linux-arm64
            [x86_64-apple-darwin]=testless-darwin-x64
            [aarch64-apple-darwin]=testless-darwin-arm64
          )

          for target in "${!targets[@]}"; do
            pkg="${targets[$target]}"
            tar xzf "$workdir/testless-${target}.tar.gz" -C "npm/${pkg}/bin" testless
            chmod +x "npm/${pkg}/bin/testless"
            npm pkg set version="$version" --prefix "npm/${pkg}"
          done

          npm pkg set version="$version" --prefix npm/testless
          node -e '
            const fs = require("node:fs");
            const path = "npm/testless/package.json";
            const pkg = JSON.parse(fs.readFileSync(path, "utf8"));
            for (const dep of Object.keys(pkg.optionalDependencies || {})) {
              pkg.optionalDependencies[dep] = process.argv[1];
            }
            fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + "\n");
          ' "$version"

          for pkg in testless-linux-x64 testless-linux-arm64 testless-darwin-x64 testless-darwin-arm64 testless; do
            npm publish --access public "npm/${pkg}"
          done
