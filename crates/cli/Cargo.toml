[package]
name = "testless"
version = "0.6.0"
edition.workspace = true
description.workspace = true
repository.workspace = true
license.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "testless"
path = "src/main.rs"

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/testless-v{ version }/testless-{ target }.tar.gz"
bin-dir = "testless"
pkg-fmt = "tgz"

[dependencies]
testless-core = { path = "../core", version = "0.6.0" }
testless-lang-ts = { path = "../lang-ts", version = "0.6.0" }
testless-lang-go = { path = "../lang-go", version = "0.6.0" }
testless-lang-rust = { path = "../lang-rust", version = "0.6.0" }
testless-lang-java = { path = "../lang-java", version = "0.6.0" }
clap = { version = "4.6.4", features = ["derive"] }
anyhow = "1.0.104"
serde_json = "1.0.151"
clap_complete = "4.6.7"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"
tree-sitter = "0.26.11"
