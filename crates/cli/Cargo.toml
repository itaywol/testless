[package]
name = "pick-a-test"
version = "0.1.0"
edition.workspace = true

[[bin]]
name = "pick-a-test"
path = "src/main.rs"

[dependencies]
pick-a-test-core = { path = "../core" }
pick-a-test-lang-ts = { path = "../lang-ts" }
pick-a-test-lang-go = { path = "../lang-go" }
clap = { version = "4.6.4", features = ["derive"] }
anyhow = "1.0.104"
serde_json = "1.0.151"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"
