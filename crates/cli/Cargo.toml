[package]
name = "testless"
version = "0.1.0"
edition.workspace = true
description.workspace = true
repository.workspace = true
license.workspace = true

[[bin]]
name = "testless"
path = "src/main.rs"

[dependencies]
testless-core = { path = "../core" }
testless-lang-ts = { path = "../lang-ts" }
testless-lang-go = { path = "../lang-go" }
testless-lang-rust = { path = "../lang-rust" }
clap = { version = "4.6.4", features = ["derive"] }
anyhow = "1.0.104"
serde_json = "1.0.151"
clap_complete = "4.6.7"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"
