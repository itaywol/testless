[workspace]
resolver = "2"
members = ["crates/core", "crates/lang-ts", "crates/lang-go", "crates/lang-rust", "crates/cli"]

[workspace.package]
edition = "2021"
license = "MIT"
description = "Function-level test impact analysis via static AST"
repository = "https://github.com/itaywol/testless"
readme = "README.md"
keywords = ["testing", "test-selection", "impact-analysis", "tree-sitter", "ci"]
categories = ["development-tools::testing", "command-line-utilities"]
